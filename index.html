<meta name="robots" content="noindex">
<<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Pulse Stopwatch | 科技風碼表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-dark: #111827;
            --panel-bg: rgba(31, 41, 55, 0.6);
            --neon-green: #4ade80;
            --neon-red: #f87171;
            --neon-cyan: #22d3ee;
            --neon-purple: #a855f7;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1f2937 0%, #030712 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .cyber-panel {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 211, 238, 0.05);
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            margin: 2rem 0;
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .timer-display.running {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        .timer-display .ms {
            font-size: 1.5rem;
            margin-left: 4px;
            opacity: 0.8;
        }

        /* --- 核心控制按鈕區 (對應您選取的區域) --- */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            position: relative;
            padding: 1.2rem;
            border-radius: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
            border: 1px solid transparent;
        }

        /* 繼續 / 開始按鈕 */
        .btn-start { 
            background: #22c55e; 
            color: #064e3b; 
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); 
        }
        
        /* 暫停按鈕 */
        .btn-pause { 
            background: #ef4444; 
            color: #450a0a; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); 
        }
        
        /* 紀錄按鈕 */
        .btn-lap { 
            background: rgba(255, 255, 255, 0.1); 
            color: #e2e8f0; 
        }

        /* 系統重置按鈕 (橫跨兩欄，帶有微光邊框) */
        .btn-reset {
            grid-column: span 2; /* 佔滿整排 */
            background: rgba(17, 24, 39, 0.8);
            color: #94a3b8;
            border: 1px solid rgba(168, 85, 247, 0.3); /* 紫色微光邊框 */
            box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.1), 0 0 15px rgba(168, 85, 247, 0.1);
            transition: all 0.3s ease;
        }

        .btn-reset:not(:disabled):hover {
            border-color: var(--neon-purple);
            color: white;
            box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.3), 0 0 20px rgba(168, 85, 247, 0.3);
        }

        /* --- 紀錄列表區 --- */
        .lap-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1.5rem;
            padding: 1rem;
            height: 200px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lap-list {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .lap-list::-webkit-scrollbar { display: none; }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 0.8rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lap-label { font-size: 0.8rem; color: #94a3b8; font-weight: 700; }
        .lap-val { font-family: 'JetBrains Mono', monospace; color: var(--neon-cyan); }
    </style>
</head>
<body>

    <div class="cyber-panel">
        <header class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <div id="statusDot" class="h-3 w-3 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></div>
                <span id="statusText" class="text-xs font-bold tracking-widest text-cyan-400 uppercase">System Ready</span>
            </div>
            <span class="text-[10px] text-slate-500 font-mono">CORE_v2.5</span>
        </header>

        <div class="timer-display" id="display">
            00:00<span class="ms">.00</span>
        </div>

        <!-- 互動按鈕區 -->
        <div class="controls">
            <button id="startBtn" class="btn btn-start">開始</button>
            <button id="lapBtn" class="btn btn-lap" disabled>紀錄</button>
            <button id="resetBtn" class="btn btn-reset" disabled>系統重置</button>
        </div>

        <div class="lap-container">
            <div class="lap-list" id="lapList"></div>
        </div>
    </div>

    <script>
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let lapsCount = 0;

        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapList = document.getElementById('lapList');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function formatTime(time) {
            let minutes = Math.floor(time / 60000);
            let seconds = Math.floor((time % 60000) / 1000);
            let milliseconds = Math.floor((time % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}<span class="ms">.${milliseconds.toString().padStart(2, '0')}</span>`;
        }

        function updateDisplay() {
            elapsedTime = Date.now() - startTime;
            display.innerHTML = formatTime(elapsedTime);
        }

        function toggleTimer() {
            if (!isRunning) {
                // 啟動 / 繼續
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(updateDisplay, 10);
                isRunning = true;
                
                startBtn.textContent = "暫停";
                startBtn.className = "btn btn-pause";
                display.classList.add('running');
                lapBtn.disabled = false;
                resetBtn.disabled = true;
                
                statusDot.className = "h-3 w-3 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]";
                statusText.textContent = "System Running";
                statusText.className = "text-xs font-bold tracking-widest text-green-400 uppercase";
            } else {
                // 暫停
                clearInterval(timerInterval);
                isRunning = false;
                
                startBtn.textContent = "繼續";
                startBtn.className = "btn btn-start";
                display.classList.remove('running');
                lapBtn.disabled = true;
                resetBtn.disabled = false; // 暫停時可以重置
                
                statusDot.className = "h-3 w-3 rounded-full bg-yellow-400 shadow-[0_0_8px_#facc15]";
                statusText.textContent = "System Paused";
                statusText.className = "text-xs font-bold tracking-widest text-yellow-400 uppercase";
            }
        }

        function recordLap() {
            lapsCount++;
            const lapTime = formatTime(elapsedTime);
            const lapDiv = document.createElement('div');
            lapDiv.className = 'lap-item';
            lapDiv.innerHTML = `
                <span class="lap-label">LAP ${lapsCount.toString().padStart(2, '0')}</span>
                <span class="lap-val">${lapTime}</span>
            `;
            lapList.prepend(lapDiv);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            lapsCount = 0;
            display.innerHTML = '00:00<span class="ms">.00</span>';
            lapList.innerHTML = '';
            isRunning = false;
            
            startBtn.textContent = "開始";
            startBtn.className = "btn btn-start";
            lapBtn.disabled = true;
            resetBtn.disabled = true;
            
            statusDot.className = "h-3 w-3 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]";
            statusText.textContent = "System Ready";
            statusText.className = "text-xs font-bold tracking-widest text-cyan-400 uppercase";
        }

        startBtn.addEventListener('click', toggleTimer);
        lapBtn.addEventListener('click', recordLap);
        resetBtn.addEventListener('click', resetTimer);

    </script>
</body>
</html>
